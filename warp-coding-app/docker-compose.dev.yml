version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: nodemon --legacy-watch webhook.js

  frontend:
    image: python:3.11-slim
    command: python -m http.server 8080
    working_dir: /usr/src/app
    volumes:
      - ./frontend:/usr/src/app:ro
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/app:/app/app:rw
      - ./ai-service/requirements.txt:/app/requirements.txt:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
