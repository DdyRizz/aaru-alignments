version: '3.8'
services:
  backend:
    build:
      context: ./warp-coding-app/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=development

  ai-service:
    build:
      context: ./warp-coding-app/ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - backend
